apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels: {app: api}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: api}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532}
      {{- if .Values.monitoring }}
      initContainers:
        - name: otel
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.78.0
          command: [cp, -r, /autoinstrumentation/., /otel]
          volumeMounts: [{name: otel, mountPath: /otel}]
      {{- end }}
      containers:
        - name: api
          image: chat-api:{{ .Values.tag }}
          ports: [{name: http, containerPort: 4040}]
          env:
            - {name: CLIENT_URL, value: {{ .Values.clientUrl | quote }}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: chat-secrets, key: JWT_SECRET}}}
            - {name: MONGO_URL, valueFrom: {secretKeyRef: {name: chat-secrets, key: MONGO_URL}}}
            {{- if .Values.monitoring }}
            - {name: NODE_OPTIONS, value: "--require /otel/autoinstrumentation.js"}
            - {name: OTEL_SERVICE_NAME, value: chat-api}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://jaeger:4318"}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: uploads, mountPath: /app/uploads}
            {{- if .Values.monitoring }}
            - {name: otel, mountPath: /otel}
            {{- end }}
      volumes:
        - {name: uploads, persistentVolumeClaim: {claimName: uploads}}
        {{- if .Values.monitoring }}
        - {name: otel, emptyDir: {}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api}
spec:
  selector: {app: api}
  ports: [{name: http, port: 4040, targetPort: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
