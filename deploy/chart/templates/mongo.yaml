apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mongo}
  template:
    metadata:
      labels: {app: mongo}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 999, fsGroup: 999}
      containers:
        - name: mongo
          image: mongo:7
          ports: [{containerPort: 27017}]
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: root}
            - {name: MONGO_INITDB_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: chat-secrets, key: MONGO_PASSWORD}}}
          readinessProbe:
            tcpSocket: {port: 27017}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: data, mountPath: /data/db}]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: mongo-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector: {app: mongo}
  ports: [{port: 27017}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo
spec:
  podSelector:
    matchLabels: {app: mongo}
  ingress:
    - from: [{podSelector: {matchLabels: {app: api}}}]
      ports: [{port: 27017}]
